<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablero de Optimización — Grupo Daabon 2026</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap');
:root{
  --navy:#0E2340;--navy2:#172F52;--navy3:#1E3D6A;
  --sky:#3A82C4;--sky2:#5B9DD4;--skyBg:#EAF3FB;
  --ink:#1A2B3C;--mid:#4A6278;--muted:#8099B0;--line:#D8E6F0;--paper:#F4F8FC;--white:#fff;
  --green:#2D7D5E;--greenBg:#E6F4EE;--greenLine:#A8D5C1;
  --amber:#B87820;--amberBg:#FDF3E0;--amberLine:#F0CC84;
  --red:#C03830;--redBg:#FAEAE8;--redLine:#E8A8A4;
  --gray:#788FA0;--grayBg:#EEF3F7;
  --gold:#C8943A;
  --font:'DM Sans',system-ui,sans-serif;
  --display:'DM Serif Display',Georgia,serif;
  --mono:'DM Mono',monospace;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);color:var(--ink);background:var(--paper);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}

/* ── AUTH ── */
.auth-wrapper{position:fixed;inset:0;background:var(--navy);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px}
.auth-box{background:var(--white);padding:40px;border-radius:14px;width:100%;max-width:400px;box-shadow:0 20px 40px rgba(0,0,0,.3);text-align:center}
.auth-box h2{font-family:var(--display);color:var(--navy);font-size:24px;margin-bottom:8px}
.auth-box p{font-size:13px;color:var(--muted);margin-bottom:24px}
.auth-field{text-align:left;margin-bottom:16px}
.auth-field label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);display:block;margin-bottom:6px}
.auth-field select,.auth-field input{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:8px;font-family:var(--font);font-size:14px;outline:none;transition:.2s}
.auth-field select:focus,.auth-field input:focus{border-color:var(--sky)}
.auth-btn{width:100%;padding:14px;background:var(--sky);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--font);transition:.2s;margin-top:8px}
.auth-btn:hover{background:var(--navy)}
.auth-error{color:var(--red);font-size:12px;font-weight:600;margin-top:12px;display:none}
#app-wrapper{display:none}

/* ── TOPBAR ── */
.topbar{background:var(--navy);color:#fff;padding:0 28px}
.topbar-inner{display:flex;align-items:flex-end;justify-content:space-between;padding:20px 0 0;flex-wrap:wrap;gap:10px}
.brand-lock{display:flex;flex-direction:column;gap:2px}
.brand-tag{font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:#6A94BE;margin-bottom:2px}
.brand-title{font-family:var(--display);font-size:26px;color:#fff;line-height:1.1}
.brand-sub{font-size:12px;color:#8CAEC8;margin-top:3px}
.vp-badge-top{font-size:11px;font-weight:700;background:var(--sky);color:#fff;padding:4px 10px;border-radius:6px;margin-left:12px;vertical-align:middle;letter-spacing:.5px}
.topbar-meta{text-align:right;font-size:11.5px;color:#6A94BE;padding-bottom:4px}
.topbar-meta b{color:#A8C8E0}
.tabs{display:flex;gap:1px;margin-top:18px}
.tab{padding:11px 22px;font-size:12.5px;font-weight:600;color:#7AAABF;cursor:pointer;border-radius:8px 8px 0 0;background:transparent;border:none;font-family:var(--font);letter-spacing:.2px;transition:.15s}
.tab:hover{color:#fff;background:rgba(255,255,255,.07)}
.tab.active{background:var(--paper);color:var(--navy);font-weight:700}

/* ── TOOLBAR ── */
.toolbar{background:var(--white);border-bottom:1px solid var(--line);padding:14px 28px;display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.fgroup{display:flex;align-items:center;gap:8px}
.fgroup label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
.chip{padding:6px 14px;font-size:12px;border:1.5px solid var(--line);background:var(--white);border-radius:20px;cursor:pointer;color:var(--muted);font-weight:500;transition:.15s;font-family:var(--font)}
.chip:hover{border-color:var(--sky);color:var(--sky)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}

/* ── CONTENT ── */
.content{padding:24px 28px;max-width:1260px;margin:0 auto}

/* ── KPI ── */
.kpi-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:24px}
.kpi{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;position:relative;overflow:hidden}
.kpi::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px}
.kpi.k0::after{background:linear-gradient(90deg,var(--sky),var(--navy))}
.kpi.k1::after{background:var(--green)}
.kpi.k2::after{background:var(--gold)}
.kpi.k4::after{background:var(--red)}
.kpi.k3::after{background:var(--gray)}
.kpi-num{font-family:var(--display);font-size:32px;color:var(--navy);line-height:1;margin-bottom:6px}
.kpi-lbl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.kpi-det{font-size:11.5px;color:var(--mid);margin-top:5px}

/* ── VP CARDS ── */
.vp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px}
.dept-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px}
.vp-card{background:var(--white);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:.15s}
.vp-card:hover{border-color:var(--sky2);box-shadow:0 4px 18px rgba(58,130,196,.12)}
.vp-card-head{padding:14px 16px;display:flex;justify-content:space-between;align-items:flex-start}
.vp-name{font-family:var(--display);font-size:16px;color:var(--navy)}
.vp-badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:5px;background:var(--skyBg);color:var(--sky);text-transform:uppercase;letter-spacing:.4px}
.vp-valor{font-family:var(--mono);font-size:18px;font-weight:500;color:var(--navy);padding:0 16px 2px}
.vp-valor small{font-family:var(--font);font-size:10.5px;color:var(--muted);font-weight:400}
.vp-cap{padding:2px 16px 6px;font-size:12px;color:var(--green);font-weight:600}
.vp-bar{height:6px;background:var(--grayBg);margin:8px 16px}
.vp-bar-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--green),var(--sky))}
.vp-footer{display:flex;justify-content:space-between;padding:8px 16px 12px;font-size:11.5px;color:var(--muted)}
.vp-footer b{color:var(--ink)}

/* ── TABLE ── */
.sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sec-title{font-family:var(--display);font-size:19px;color:var(--navy)}
.sec-sub{font-size:12px;color:var(--muted)}
.tbl-wrap{background:var(--white);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:20px}
table{width:100%;border-collapse:collapse}
thead tr{background:var(--navy)}
th{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#9BBBD0;padding:12px 14px;text-align:left}
td{padding:11px 14px;border-bottom:1px solid var(--line);font-size:12.5px;vertical-align:top}
tr.data-row:last-child td{border-bottom:none}
tr.data-row:hover td{background:var(--skyBg)}
tr.late-row td{background:#FFF4F4}
tr.archived-row td{opacity:.5;background:#fafafa}
tr.archived-row .plan-text{text-decoration:line-through}
.dept-sep td{background:var(--navy2);color:#fff;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;padding:8px 14px;border-bottom:none}
.plan-text{color:var(--ink);line-height:1.45;max-width:360px}
.plan-area{font-size:10.5px;color:var(--muted);margin-top:2px}
.tipo-tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:5px;white-space:nowrap}
.tipo-tag.tec{background:var(--skyBg);color:#2A6FA0}
.tipo-tag.pro{background:var(--greenBg);color:var(--green)}
.impact-val{font-family:var(--mono);font-size:12.5px;font-weight:500;color:var(--navy)}
.fecha-cell{font-size:12px;color:var(--mid);white-space:nowrap}
.fecha-cell.late{color:var(--red);font-weight:700}

/* ── STATUS BUTTON ── */
.st-btn{display:inline-flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;border:1.5px solid var(--line);border-radius:7px;padding:5px 12px;background:var(--white);font-family:var(--font);transition:.15s;white-space:nowrap;min-width:90px}
.st-btn.clickable{cursor:pointer}
.st-btn.clickable:hover{opacity:.85}
.st-btn.ejecutado{background:var(--green);border-color:var(--green);color:#fff}
.st-btn.prog{background:var(--amberBg);border-color:var(--amberLine);color:var(--amber)}
.st-btn.pend{background:var(--grayBg);border-color:var(--line);color:var(--gray)}
.st-btn.atrasado{background:var(--redBg);border-color:var(--redLine);color:var(--red)}
.st-btn.archived{background:var(--grayBg);border-color:var(--line);color:var(--muted);opacity:.6}

/* ── BUTTONS ── */
.seg-btn{font-size:11px;font-weight:600;color:var(--sky);background:var(--skyBg);border:none;padding:5px 10px;border-radius:6px;cursor:pointer;font-family:var(--font);white-space:nowrap;transition:.15s}
.seg-btn:hover{background:var(--sky);color:#fff}
.edit-icon-btn{background:transparent;border:1px solid var(--line);padding:4px 8px;border-radius:6px;cursor:pointer;margin-left:4px;font-size:12px;transition:.15s}
.edit-icon-btn:hover{background:var(--amberBg);border-color:var(--amberLine)}
.btn{padding:8px 18px;border-radius:7px;font-weight:600;font-size:12.5px;cursor:pointer;border:none;font-family:var(--font);transition:.15s}
.btn.primary{background:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy3)}
.btn.ghost{background:transparent;color:var(--muted);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--sky);color:var(--sky)}
.btn-nueva{font-size:12px;font-weight:700;color:#fff;background:var(--green);border:none;padding:7px 14px;border-radius:8px;cursor:pointer;font-family:var(--font);transition:.15s}
.btn-nueva:hover{background:var(--navy)}

/* ── CRONOGRAMA ── */
.crono-switch{display:flex;gap:6px;margin-bottom:16px}
.c-btn{padding:7px 16px;font-size:12.5px;font-weight:600;border-radius:7px;border:1.5px solid var(--line);background:var(--white);color:var(--muted);cursor:pointer;font-family:var(--font);transition:.15s}
.c-btn.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.tl-wrap{background:var(--white);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px;overflow:hidden}
.tl-head{background:var(--navy2);padding:11px 18px;display:flex;justify-content:space-between;align-items:center}
.tl-vp{color:#fff;font-weight:700;font-size:12.5px;letter-spacing:.5px;text-transform:uppercase}
.tl-vp-val{font-family:var(--mono);font-size:11.5px;color:#8CAEC8}
.tl-scroll{overflow-x:auto;padding:12px 16px 16px}
.tl-track{position:relative;min-width:900px}
.tl-months{display:grid;grid-template-columns:repeat(12,1fr)}
.tl-m{text-align:center;font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;padding-bottom:8px}
.tl-line{height:2px;background:var(--line);border-radius:2px;position:relative}
.tl-line-fill{position:absolute;top:0;left:0;height:100%;background:linear-gradient(90deg,var(--green),var(--sky));border-radius:2px;transition:.6s}
.tl-cols{display:grid;grid-template-columns:repeat(12,1fr)}
.tl-col{position:relative;border-right:1px dashed #E8EFF5;padding-top:10px;min-height:60px}
.tl-col:last-child{border-right:none}
.tl-item{cursor:pointer;text-align:center;margin:0 2px 8px;transition:.15s}
.tl-item:hover .tl-chip{background:var(--navy);color:#fff;border-color:var(--navy)}
.tl-chip{font-size:9.5px;font-weight:600;line-height:1.3;padding:4px 7px;border-radius:8px;background:var(--paper);border:1px solid var(--line);color:var(--ink);display:block;word-break:break-word;text-align:center;transition:.15s;min-width:72px}
.tl-chip.tl-done{border-color:var(--greenLine);background:var(--greenBg);color:var(--green)}
.tl-chip.tl-pend{border-color:var(--line);background:var(--grayBg);color:var(--gray)}
.tl-chip.tl-late{border-color:var(--redLine);background:var(--redBg);color:var(--red)}
.tl-chip .tl-dept{font-size:9.5px;font-weight:700;display:block;margin-bottom:2px}
.tl-chip .tl-imp{font-size:8.5px;font-weight:600;opacity:.85;display:block}
.tl-nodate{padding:8px 16px 12px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tl-nd-lbl{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.tl-nd-chip{font-size:11px;padding:3px 10px;border-radius:20px;cursor:pointer;font-weight:500;border:1px solid var(--line);background:var(--paper);color:var(--mid);transition:.15s}
.tl-nd-chip:hover{background:var(--navy);color:#fff;border-color:var(--navy)}
.tl-nd-chip.tl-done{border-color:var(--greenLine);background:var(--greenBg);color:var(--green)}
.tl-nd-chip.tl-late{border-color:var(--redLine);background:var(--redBg);color:var(--red)}
.tl-nd-chip.tl-pend{border-color:var(--line);background:var(--grayBg);color:var(--gray)}
.lista-wrap{background:var(--white);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px;overflow:hidden}
.lista-head{background:var(--navy2);padding:11px 18px}
.lista-vp{color:#fff;font-weight:700;font-size:12.5px;letter-spacing:.5px;text-transform:uppercase}
.lista-tbl{width:100%;border-collapse:collapse}
.lista-tbl th{background:var(--paper);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;color:var(--muted);padding:9px 14px;border-bottom:1px solid var(--line);text-align:left}
.lista-tbl td{padding:10px 14px;border-bottom:1px solid var(--line);font-size:12.5px;vertical-align:middle}
.lista-tbl tr:last-child td{border-bottom:none}
.lista-tbl tr:hover td{background:var(--skyBg);cursor:pointer}
.leg{display:flex;gap:14px;padding:13px 18px;background:var(--white);border:1px solid var(--line);border-radius:var(--r);flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:4px}
.leg span{display:inline-flex;align-items:center;gap:6px}

/* ── MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(10,25,50,.6);display:none;align-items:flex-start;justify-content:center;padding:36px 16px;z-index:100;overflow-y:auto;backdrop-filter:blur(3px)}
.overlay.show{display:flex}
.modal{background:var(--white);border-radius:14px;max-width:600px;width:100%;box-shadow:0 32px 80px rgba(0,0,0,.35);max-height:90vh;overflow-y:auto}
.modal-top{background:var(--navy);padding:20px 24px;border-radius:14px 14px 0 0}
.modal-tag{font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#6A94BE;margin-bottom:6px}
.modal-ttl{font-family:var(--display);font-size:17px;color:#fff;line-height:1.4}
.modal-body{padding:22px 24px}
.mrow{display:flex;gap:18px;margin-bottom:16px;flex-wrap:wrap}
.mf{flex:1;min-width:110px}
.mf .ml{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:4px}
.mf .mv{font-size:14px;font-weight:700;color:var(--navy)}
.mf select,.mf input{width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:7px;font-family:var(--font);font-size:13px;color:var(--ink);background:var(--white)}
.mf select:focus,.mf input:focus{outline:none;border-color:var(--sky)}
.seg-section-h{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:16px 0 10px;padding-top:16px;border-top:1px solid var(--line)}
.seg-list{display:flex;flex-direction:column;gap:9px;max-height:220px;overflow-y:auto;margin-bottom:14px}
.seg-item{background:var(--paper);border-left:3px solid var(--sky);border-radius:0 8px 8px 0;padding:10px 14px}
.seg-item .si-meta{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-bottom:4px}
.seg-item .si-meta b{color:var(--navy)}
.seg-item .si-txt{font-size:12.5px;color:var(--ink);line-height:1.45}
.seg-empty{font-size:12.5px;color:var(--muted);font-style:italic;padding:6px 0}
.add-box{background:var(--skyBg);border-radius:10px;padding:14px}
.add-box.require-note{border:2px solid var(--amber);background:var(--amberBg)}
.add-box select,.add-box textarea{width:100%;border:1.5px solid #C8DEF0;border-radius:7px;padding:8px 10px;font-family:var(--font);font-size:13px;margin-bottom:8px;resize:vertical;background:var(--white)}
.add-box.require-note select,.add-box.require-note textarea{border-color:var(--amberLine)}
.add-box textarea{min-height:56px}
.add-actions{display:flex;justify-content:flex-end;gap:8px}
.edit-box{background:#FFF8EE;border:1.5px solid var(--amberLine);border-radius:10px;padding:14px;margin-bottom:16px}
.edit-box label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--amber);display:block;margin-bottom:4px}
.edit-box textarea,.edit-box input,.edit-box select{width:100%;border:1.5px solid var(--amberLine);border-radius:7px;padding:8px 10px;font-family:var(--font);font-size:13px;background:var(--white);margin-bottom:10px}
.edit-box textarea{min-height:60px;resize:vertical}
.saved-note{font-size:11px;color:var(--green);font-weight:700;opacity:0;transition:.3s;margin-left:8px}
.saved-note.show{opacity:1}
.modal-close{float:right;cursor:pointer;color:#6A94BE;font-size:22px;line-height:1;border:none;background:none;padding:0}
/* ── TOAST ── */
.toast{position:fixed;bottom:24px;right:24px;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:600;z-index:9999;opacity:0;transform:translateY(10px);transition:.3s;pointer-events:none;max-width:320px}
.toast.show{opacity:1;transform:translateY(0)}
.toast.success{background:var(--green);color:#fff}
.toast.error{background:var(--red);color:#fff}
.toast.warn{background:var(--amber);color:#fff}
@media(max-width:900px){.kpi-strip{grid-template-columns:repeat(3,1fr)}.vp-grid,.dept-grid{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.kpi-strip{grid-template-columns:1fr 1fr}.vp-grid,.dept-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="auth-wrapper" id="login-screen">
  <div class="auth-box">
    <h2>Tablero de Optimización</h2>
    <p>Grupo Daabon · 2026</p>
    <div class="auth-field">
      <label>Vicepresidencia / Rol</label>
      <select id="login-role">
        <option value="admin">Administrador Global</option>
        <option value="VPDH">VP Desarrollo Humano</option>
        <option value="VPE">VP Ejecutiva</option>
        <option value="VPF">VP Financiera</option>
        <option value="VLOP">VP Log. &amp; Operaciones</option>
        <option value="AUD">Auditoría</option>
      </select>
    </div>
    <div class="auth-field">
      <label>Contraseña</label>
      <input type="password" id="login-pass" placeholder="Ingresa tu clave" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="auth-btn" onclick="doLogin()" id="btn-ingresar">Ingresar</button>
    <div class="auth-error" id="login-error"></div>
  </div>
</div>

<!-- CAMBIO CONTRASEÑA -->
<div class="auth-wrapper" id="change-pwd-screen" style="display:none">
  <div class="auth-box">
    <h2>Configura tu contraseña</h2>
    <p>Primer acceso — establece una contraseña privada para tu cuenta.</p>
    <div class="auth-field">
      <label>Nueva contraseña</label>
      <input type="password" id="new-pass-1" placeholder="Mínimo 6 caracteres">
    </div>
    <div class="auth-field">
      <label>Confirmar contraseña</label>
      <input type="password" id="new-pass-2" placeholder="Repite la contraseña" onkeydown="if(event.key==='Enter')doChangePwd()">
    </div>
    <button class="auth-btn" onclick="doChangePwd()" id="btn-cambiar">Guardar y continuar</button>
    <div class="auth-error" id="pwd-error"></div>
  </div>
</div>

<!-- APP -->
<div id="app-wrapper">
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand-lock">
        <div class="brand-tag">Grupo Daabon · Comité de Negocios</div>

// T6+T7: Toast notification system
function showToast(msg,type='success',ms=2800){
  const t=document.getElementById('toast');
  if(!t)return;
  t.textContent=msg;t.className='toast show '+type;
  clearTimeout(t._timer);
  t._timer=setTimeout(()=>t.classList.remove('show'),ms);
}

async function apiCall(action,params){
  if(sessionRole&&sessionPass){params.role=sessionRole;params.password=sessionPass;}
  try{
    const url=API_URL+'?'+new URLSearchParams({action,data:JSON.stringify(params)});
    const r=await fetch(url);
    return await r.json();
  }catch(e){
    console.error('apiCall error',e);
    // T2: reset login button if network fails
    const btn=document.getElementById('btn-ingresar');
    if(btn&&btn.textContent==='Verificando...')btn.textContent='Ingresar';
    return{error:'Sin conexión. Verifica tu internet e intenta de nuevo.'};
  }
}

// ─── AUTH ─────────────────────────────────────────────────
async function doLogin(){
  const role=document.getElementById('login-role').value;
  const pass=document.getElementById('login-pass').value;
  const err=document.getElementById('login-error');
  const btn=document.getElementById('btn-ingresar');
  if(!pass){err.textContent='Ingresa la contraseña';err.style.display='block';return;}
  btn.textContent='Verificando...';err.style.display='none';
  const res=await apiCall('login',{role,password:pass});
  if(res.ok){
    if(res.needsChange){
      document.getElementById('login-screen').style.display='none';
      document.getElementById('change-pwd-screen').style.display='flex';
      sessionStorage.setItem('temp_role',role);
      sessionStorage.setItem('temp_pass',pass);
    }else{
      sessionRole=role;sessionPass=pass;
      sessionStorage.setItem('daabon_role',role);
      sessionStorage.setItem('daabon_pass',pass);
      await initApp();
    }
  }else{err.textContent=res.error||'Error de autenticación';err.style.display='block';btn.textContent='Ingresar';}
}

async function doChangePwd(){
  const p1=document.getElementById('new-pass-1').value;
  const p2=document.getElementById('new-pass-2').value;
  const err=document.getElementById('pwd-error');
  const btn=document.getElementById('btn-cambiar');
  if(p1.length<6){err.textContent='Debe tener al menos 6 caracteres';err.style.display='block';return;}
  if(p1!==p2){err.textContent='Las contraseñas no coinciden';err.style.display='block';return;}
  const role=sessionStorage.getItem('temp_role');
  const oldP=sessionStorage.getItem('temp_pass');
  btn.textContent='Guardando...';err.style.display='none';
  const res=await apiCall('changePassword',{role,oldPassword:oldP,newPassword:p1});
  if(res.ok){
    sessionRole=role;sessionPass=p1;
    sessionStorage.setItem('daabon_role',role);
    sessionStorage.setItem('daabon_pass',p1);
    await initApp();
  }else{err.textContent='Error al cambiar contraseña';err.style.display='block';btn.textContent='Guardar y continuar';}
}

function logout(){sessionStorage.clear();location.reload();}

// ─── INIT APP ─────────────────────────────────────────────
async function initApp(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('change-pwd-screen').style.display='none';
  // BUG #3: Mostrar loader y bloquear tabs mientras carga
  document.getElementById('app-wrapper').style.display='block';
  document.getElementById('content').innerHTML=`
    <div style="display:flex;align-items:center;justify-content:center;height:300px;flex-direction:column;gap:16px">
      <div style="width:40px;height:40px;border:3px solid var(--line);border-top-color:var(--sky);border-radius:50%;animation:spin .8s linear infinite"></div>
      <span style="color:var(--muted);font-size:13px">Cargando datos...</span>
    </div>
    <style>@keyframes spin{to{transform:rotate(360deg)}}</style>`;
  document.querySelectorAll('.tab').forEach(t=>t.style.pointerEvents='none');

  // Filtrar data según rol
  DATA=sessionRole==='admin'?[...DATA_BASE]:DATA_BASE.filter(i=>i.vp===sessionRole);
  // BUG #9: rebuild DATA_MAP for O(1) lookup
  DATA_MAP=new Map(DATA.map(i=>[i.id,i]));
  document.getElementById('top-vp-badge').textContent=sessionRole==='admin'?'Global':sessionRole;

  // Ocultar filtro VP para roles específicos
  if(sessionRole!=='admin')document.getElementById('vp-filters').style.display='none';
  else{filter.vp='all';}

  // T14: Reset store to avoid session data leak between logins
  store={};
  // Inicializar store con defaults
  for(const it of DATA){
    const isEjec=it.status==='Ejecutado';
    store[it.id]={
      status:it.status,
      fteCapturado:isEjec&&it.fte?it.fte:0,
      copCapturado:isEjec&&it.cop?it.cop:0,
      segs:[],planOverride:null,fechaOverride:null
    };
  }

  // Cargar desde Sheets
  const res=await apiCall('getAll',{});
  if(!res.ok){
    if(res.error&&res.error.includes('denegado')){logout();return;}
    console.warn('Cargando en modo local:',res.error);
  }else{
    // Aplicar records
    Object.keys(res.records).forEach(id=>{
      const rec=res.records[id];
      if(!store[id])store[id]={status:'Pendiente',fteCapturado:0,copCapturado:0,segs:[],planOverride:null,fechaOverride:null};
      if(rec.status)store[id].status=rec.status;
      if(rec.fteCapturado!=null)store[id].fteCapturado=Number(rec.fteCapturado)||0;
      if(rec.copCapturado!=null)store[id].copCapturado=Number(rec.copCapturado)||0;
      if(rec.segs&&rec.segs.length){
        // B6: getAllRecords pushes oldest-first, frontend unshifts newest-first
        // Reverse on load so display order matches what user saw during session
        store[id].segs=[...rec.segs].reverse();
      }
      const it=DATA_MAP.get(id)||DATA.find(x=>x.id===id); // BUG #9: O(1) lookup
      if(it){
        if(rec.planOverride){store[id].planOverride=rec.planOverride;it.plan=rec.planOverride;}
      if(rec.fechaOverride){
          store[id].fechaOverride=rec.fechaOverride;
          const dateOnly=rec.fechaOverride.split('T')[0]; // strip time part
          const[y,m,d]=dateOnly.split('-');
          it.fecha=new Date(y,m-1,d);it.fechaTxt=`${d}/${m}/${y}`;
}
      }
    });
    // Cargar customs
    if(res.customs&&res.customs.length){
      res.customs.forEach(init=>{
        if(!DATA.find(x=>x.id===init.id)){
          let fechaObj=null;
          if(init.fechaTxt&&init.fechaTxt!=='Sin fecha'){
            const[d,m,y]=init.fechaTxt.split('/');
            fechaObj=d&&m&&y?new Date(y,m-1,d):null;
          }
          DATA.push({...init,fecha:fechaObj});
          DATA_MAP.set(init.id,DATA[DATA.length-1]); // T9: keep MAP in sync with customs from Sheets
          if(!store[init.id])store[init.id]={status:init.status,fteCapturado:0,copCapturado:0,segs:[],planOverride:null,fechaOverride:null};
        }
      });
    }
  }

  document.querySelectorAll('.tab').forEach(t=>t.style.pointerEvents='');
  resetFilters();
  render();
}

// FIX #7: Limpiar filtros al iniciar
function resetFilters(){
  filter={vp:sessionRole==='admin'?'all':sessionRole,tipo:'all',arch:'active'};
  document.querySelectorAll('.chip').forEach(c=>{
    if(c.dataset.f)c.classList.toggle('on',c.dataset.v==='all'||c.dataset.v===filter[c.dataset.f]);
  });
}

async function saveRec(id){
  // FIX #1: saveRec solo guarda el record, NO los segs (eso lo hace addSeg por separado)
  const rec={...store[id]};
  delete rec.segs; // No mandar segs en saveRecord — van por addSeg
  const res=await apiCall('saveRecord',{id,record:rec});
  // T6: feedback si falla
  if(!res||res.error){
    showToast('⚠️ No se pudo guardar en la nube. Verifica tu conexión.','error',4000);
  }
}

// ─── FILTRADO ─────────────────────────────────────────────
function filtered(){
  return DATA.filter(i=>{
    if(!store[i.id])return false; // F1: skip items without store entry
    if(filter.vp!=='all'&&i.vp!==filter.vp)return false;
    if(filter.tipo!=='all'&&i.tipo!==filter.tipo)return false;
    if(filter.arch==='active'&&store[i.id].status==='Archivada')return false;
    return true;
  });
}

function statusClass(st){return SC[st]||'pend';}

// FIX: Detectar Atrasado automáticamente (no modifica store, solo para display)
function displayStatus(id){
  // T4: null check — store may not have entry yet for customs loaded mid-render
  if(!store[id])return'Pendiente';
  const st=store[id].status;
  if(st==='Ejecutado'||st==='Archivada'||st==='En curso')return st;
  const it=DATA_MAP.get(id)||DATA.find(x=>x.id===id); // BUG #9: O(1) lookup
  // Sin fecha o fecha vencida = Atrasado (también cuenta en KPI)
  if(!it||!it.fecha)return'Atrasado';
  if(it.fecha<TODAY)return'Atrasado';
  return st;
}

      <div class="kpi k3"><div class="kpi-num">${archivadas}</div><div class="kpi-lbl">Archivadas</div><div class="kpi-det">No afectan métricas</div></div>
    </div>
    <div class="sec-h"><div class="sec-title">${sessionRole==='admin'?'Avance por Vicepresidencia':'Avance por Departamento'}</div><div class="sec-sub">Clic para filtrar</div></div>
    <div class="${sessionRole==='admin'?'vp-grid':'dept-grid'}">${cards}</div>`;
}

function setVPFilter(vp){
  filter.vp=vp;
  document.querySelectorAll('.chip[data-f="vp"]').forEach(c=>{c.classList.remove('on');if(c.dataset.v===vp)c.classList.add('on');});
  view='seguimiento';
  document.querySelectorAll('.tab').forEach(t=>{t.classList.remove('active');if(t.dataset.view==='seguimiento')t.classList.add('active');});
  render();
}

function setDeptFilter(dept){
  // Para VP no-admin, filtrar por dept mostrando seguimiento
  view='seguimiento';
  document.querySelectorAll('.tab').forEach(t=>{t.classList.remove('active');if(t.dataset.view==='seguimiento')t.classList.add('active');});
  render();
  // Scroll to dept section
  setTimeout(()=>{
    const el=document.querySelector(`[data-dept="${dept}"]`);
    if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
  },100);
}

// ─── SEGUIMIENTO ──────────────────────────────────────────
function renderSeguimiento(){
  const items=filtered();
  const byVP={};
  items.forEach(i=>{
    (byVP[i.vp]=byVP[i.vp]||{name:VP_NAMES[i.vp],depts:{}});
    (byVP[i.vp].depts[i.dept]=byVP[i.vp].depts[i.dept]||[]).push(i);
  });

  let html='';
  Object.keys(byVP).forEach(vp=>{
    const{name,depts}=byVP[vp];
    let rows='';
    Object.keys(depts).forEach(dept=>{
      rows+=`<tr class="dept-sep" data-dept="${dept}"><td colspan="9">▸ ${dept}</td></tr>`;
      depts[dept].forEach(i=>{
        const rec=store[i.id];
        const dSt=displayStatus(i.id); // FIX: usar displayStatus en lugar de rec.status directamente
        const sc=statusClass(dSt);
        const isArchived=rec.status==='Archivada';
        const isLate=dSt==='Atrasado';
        const ns=(rec.segs&&rec.segs.length)||0; // F2: guard segs undefined
        rows+=`<tr class="data-row${isLate?' late-row':''}${isArchived?' archived-row':''}">
          <td><div class="plan-text">${esc(i.plan)}</div><div class="plan-area">${i.area}</div></td>
          <td><span class="tipo-tag ${i.tipo==='Tecnologia'?'tec':'pro'}">${i.tipo==='Tecnologia'?'Tec':'Proceso'}</span></td>
          <td><div class="impact-val">${i.fte?fmtN(i.fte)+' FTE':'—'}</div></td>
          <td><div class="impact-val" style="font-size:11.5px">${fmtCOP(i.cop)}</div></td>
          <td class="fecha-cell${(isLate||i.fechaTxt==='Sin fecha'&&dSt!=='Ejecutado')?' late':''}">${i.fechaTxt==='Sin fecha'&&dSt!=='Ejecutado'?'⚠ Sin fecha':i.fechaTxt}</td>
          <td><span class="st-btn ${sc}">${dSt}</span></td>
          <td><div class="impact-val" style="color:var(--green)">${rec.fteCapturado||0}</div></td>
          <td><div class="impact-val" style="font-size:11.5px;color:var(--green)">${fmtCOP(rec.copCapturado||0)}</div></td>
          <td style="white-space:nowrap">
            <button class="seg-btn" onclick="openModal('${i.id}',false)">Seguimiento${ns?` (${ns})`:''}</button>
            <button class="edit-icon-btn" onclick="openModal('${i.id}',true)" title="Editar">✏️</button>
          </td>
        </tr>`;
      });
    });

    const vItems=items.filter(x=>x.vp===vp);
    const vDone=vItems.filter(x=>store[x.id].status==='Ejecutado').length;
    const vCop=vItems.reduce((s,x)=>s+x.cop,0);

    html+=`<div class="sec-h" style="margin-top:${html?'24px':'0'}">
      <div class="sec-title">${name}</div>
      <div style="display:flex;align-items:center;gap:10px">
        <span class="sec-sub">${vDone}/${vItems.length} ejecutadas · ${fmtCOP(vCop)}</span>
        <button class="btn-nueva" onclick="openNuevaForm('${vp}')">＋ Nueva iniciativa</button>
      </div>
    </div>
    <div id="nueva-form-${vp}"></div>
    <div class="tbl-wrap"><table>
      <thead><tr>
        <th style="width:28%">Iniciativa</th><th>Tipo</th><th>FTE Lib.</th>
        <th>COP Comp.</th><th>Fecha</th><th>Estado</th>
        <th>FTE Cap.</th><th>COP Cap.</th><th>Acciones</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
  });

  document.getElementById('content').innerHTML=html||'<p style="color:var(--muted);padding:20px">No hay iniciativas para los filtros seleccionados.</p>';
}

function openNuevaForm(vp){
  const c=document.getElementById('nueva-form-'+vp);
  if(!c)return;
  const topts=['Proceso','Tecnologia'].map(t=>`<option>${t}</option>`).join('');
  c.innerHTML=`<div class="edit-box" style="background:var(--skyBg);border-color:var(--sky)">
    <div style="font-family:var(--display);font-size:16px;color:var(--navy);margin-bottom:12px">Crear Nueva Iniciativa</div>
    <label>Plan de acción</label><textarea id="nf-plan" style="border-color:var(--line)" placeholder="Describe la acción a realizar..."></textarea>
    <div style="display:flex;gap:10px;margin-bottom:10px">
      <div style="flex:1"><label>Departamento</label><input id="nf-dept" style="border-color:var(--line)" placeholder="Departamento"></div>
      <div style="flex:1"><label>Tipo</label><select id="nf-tipo" style="border-color:var(--line)">${topts}</select></div>
    </div>
    <div style="display:flex;gap:10px">
      <div style="flex:1"><label>FTE Liberado</label><input type="number" min="0" id="nf-fte" style="border-color:var(--line)" placeholder="0"></div>
      <div style="flex:1"><label>COP (Millones)</label><input type="number" min="0" id="nf-cop" style="border-color:var(--line)" placeholder="0"></div>
      <div style="flex:1"><label>Fecha</label><input type="date" id="nf-fecha" style="border-color:var(--line)"></div>
    </div>
    <div style="text-align:right;margin-top:12px;display:flex;gap:8px;justify-content:flex-end">
      <button class="btn ghost" onclick="document.getElementById('nueva-form-${vp}').innerHTML=''">Cancelar</button>
      <button class="btn primary" onclick="guardarNueva('${vp}')">Guardar iniciativa</button>
    </div>
  </div>`;
}

async function guardarNueva(vp){
  const plan=document.getElementById('nf-plan').value.trim();
  if(!plan){
    document.getElementById('nf-plan').style.border='2px solid var(--red)';
    document.getElementById('nf-plan').placeholder='⚠️ Este campo es obligatorio';
    return;
  }
  // BUG #6: bloquear botón mientras guarda para evitar duplicados
  const btnGuardar=document.querySelector(`#nueva-form-${vp} .btn.primary`);
  if(btnGuardar){btnGuardar.disabled=true;btnGuardar.textContent='Guardando...';}
  const dept=document.getElementById('nf-dept').value.trim()||'General';
  const tipo=document.getElementById('nf-tipo').value;
  const fte=parseFloat(document.getElementById('nf-fte').value)||null;
  const cop=(parseFloat(document.getElementById('nf-cop').value)||0)*1e6;
  const fVal=document.getElementById('nf-fecha').value;
  let fechaObj=null,fTxt='Sin fecha';
  if(fVal){const[y,m,d]=fVal.split('-');fechaObj=new Date(y,m-1,d);fTxt=`${d}/${m}/${y}`;}
  const id='custom-'+Date.now();
  const init={id,vp,dept,area:dept,tipo,plan,fechaTxt:fTxt,fte,cop,status:'Pendiente'};
  DATA.push({...init,fecha:fechaObj});
  DATA_MAP.set(id,DATA[DATA.length-1]);
  store[id]={status:'Pendiente',fteCapturado:0,copCapturado:0,segs:[],planOverride:null,fechaOverride:null};
  await apiCall('saveNew',{initiative:{...init,createdBy:sessionRole}});
  render();
}

// ─── CRONOGRAMA ───────────────────────────────────────────
function renderCronograma(){
  const items=filtered().filter(i=>store[i.id].status!=='Archivada');
  const vps=sessionRole==='admin'?['VPDH','VPE','VPF','VLOP','AUD']:[sessionRole];
  const sw=`<div class="crono-switch">
    <button class="c-btn ${cronoSub==='timeline'?'active':''}" onclick="setCronoSub('timeline')">🗓 Línea de tiempo</button>
    <button class="c-btn ${cronoSub==='lista'?'active':''}" onclick="setCronoSub('lista')">☰ Lista</button>
  </div>`;
  let body='';
  vps.forEach(vp=>{
    const arr=items.filter(i=>i.vp===vp);
    if(!arr.length)return;
    const cop=arr.reduce((s,i)=>s+i.cop,0);
    body+=cronoSub==='timeline'?buildTL(arr,VP_NAMES[vp],fmtCOP(cop)):buildLista(arr,VP_NAMES[vp]);
  });
  const leg=`<div class="leg">
    <span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--green);margin-right:4px"></span>Ejecutado</span>
    <span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--grayBg);border:1px solid var(--line);margin-right:4px"></span>Pendiente/En curso</span>
    <span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--redBg);border:1px solid var(--redLine);margin-right:4px"></span>Atrasado / Sin fecha</span>
    <span style="margin-left:auto;font-size:11px">Clic para abrir detalles</span>
  </div>`;
  document.getElementById('content').innerHTML=sw+body+leg;
}

function tlColorFn(i){
  const d=displayStatus(i.id);
  if(d==='Ejecutado')return'tl-done';
  if(d==='Atrasado')return'tl-late';
  return'tl-pend';
}
function tlImpact(i){
  const p=[];
  if(i.fte)p.push(fmtN(i.fte)+' FTE');
  if(i.cop)p.push(fmtCOP(i.cop));
  return p.join(' · ')||'';
}
function buildTL(arr,label,val){
  const buckets=Array.from({length:12},()=>[]);
  const nodate=[];
  arr.forEach(i=>{if(i.fecha&&i.fecha.getFullYear()===2026)buckets[i.fecha.getMonth()].push(i);else nodate.push(i);});
  const maxStack=Math.max(...buckets.map(b=>b.length),1);
  const tlH=Math.max(90,16+maxStack*68+12);
  const progPct=Math.round(arr.filter(i=>displayStatus(i.id)==='Ejecutado').length/arr.length*100)||0;
  let cols='';
  for(let m=0;m<12;m++){
    let its='';
    buckets[m].forEach(i=>{
      const cls=tlColorFn(i);const imp=tlImpact(i);
      its+=`<div class="tl-item" onclick="openModal('${i.id}',false)" title="${esc(i.plan)}">
        <span class="tl-chip ${cls}"><span class="tl-dept">${i.dept}</span>${imp?`<span class="tl-imp">${imp}</span>`:''}</span>
      </div>`;
    });
    cols+=`<div class="tl-col">${its}</div>`;
  }
  const nd=nodate.length?`<div class="tl-nodate"><span class="tl-nd-lbl" style="color:var(--red)">⚠ Sin fecha:</span>${nodate.map(i=>{
    const cls=tlColorFn(i);const imp=tlImpact(i);
    return`<span class="tl-nd-chip ${cls}" onclick="openModal('${i.id}',false)" title="${esc(i.plan)}">${i.dept}${imp?' · '+imp:''}</span>`;
  }).join('')}</div>`:'';
  return`<div class="tl-wrap">
    <div class="tl-head"><span class="tl-vp">${label}</span><span class="tl-vp-val">${val}</span></div>
    <div class="tl-scroll"><div class="tl-track" style="height:${tlH+30}px">
      <div class="tl-months">${MONTHS.map(m=>`<div class="tl-m">${m}</div>`).join('')}</div>
      <div class="tl-line"><div class="tl-line-fill" style="width:${progPct}%"></div></div>
      <div class="tl-cols" style="height:${tlH}px">${cols}</div>
    </div></div>${nd}
  </div>`;
}
function buildLista(arr,label){
  const sorted=[...arr].sort((a,b)=>{if(!a.fecha&&!b.fecha)return 0;if(!a.fecha)return 1;if(!b.fecha)return -1;return a.fecha-b.fecha;});
  const rows=sorted.map(i=>{
    const sc=statusClass(displayStatus(i.id));
    const late=displayStatus(i.id)==='Atrasado';
    return`<tr onclick="openModal('${i.id}',false)">
      <td><b>${i.dept}</b></td>
      <td style="max-width:340px">${esc(i.plan.length>70?i.plan.slice(0,68)+'…':i.plan)}</td>
      <td><span class="tipo-tag ${i.tipo==='Tecnologia'?'tec':'pro'}">${i.tipo==='Tecnologia'?'Tec':'Proceso'}</span></td>
      <td class="fecha-cell${(late||(!i.fecha&&displayStatus(i.id)!=='Ejecutado'))?' late':''}">${!i.fecha&&displayStatus(i.id)!=='Ejecutado'?'⚠ Sin fecha':i.fechaTxt}</td>
      <td><span class="st-btn ${sc}">${displayStatus(i.id)}</span></td>
    </tr>`;
  }).join('');
  return`<div class="lista-wrap">
    <div class="lista-head"><span class="lista-vp">${label}</span></div>
    <table class="lista-tbl"><thead><tr><th>Departamento</th><th>Iniciativa</th><th>Tipo</th><th>Fecha</th><th>Estado</th></tr></thead><tbody>${rows}</tbody></table>
  </div>`;
}
function setCronoSub(v){cronoSub=v;renderCronograma();}

// ─── MODAL ────────────────────────────────────────────────
function openModal(id,isEdit){
  const i=DATA_MAP.get(id)||DATA.find(x=>x.id===id); // BUG #9: O(1) lookup
  const rec=store[id];
  // T5: null check — defensive guard
  if(!i||!rec){console.warn('openModal: id not found',id);return;}
  const dSt=displayStatus(id);
  const sc=statusClass(dSt);

  // FIX #3 & #6: Estado con color en modal
  const stBadge=`<span class="st-btn ${sc}" style="cursor:default">${dSt}</span>`;

  const segs=(rec.segs&&rec.segs.length) // F2: guard segs undefined
    ?rec.segs.map(s=>`<div class="seg-item"><div class="si-meta"><b>${esc(s.autor)}</b><span>${s.fecha}</span></div><div class="si-txt">${esc(s.txt)}</div></div>`).join('')
    :'<div class="seg-empty">Sin seguimientos registrados.</div>';

  const opts=STATUSES_SELECT.map(s=>`<option value="${s}"${s===rec.status?' selected':''}>${s}</option>`).join('');

  let body='';
  if(isEdit){
    body=`<div class="edit-box">
      <label>Plan de acción</label>
      <textarea id="edit-plan">${esc(i.plan)}</textarea>
      <div style="display:flex;gap:10px">
        <div style="flex:1"><label>Estado</label><select id="edit-st">${opts}</select></div>
        <div style="flex:1"><label>Fecha compromiso</label><input type="date" id="edit-fecha" value="${i.fecha?i.fecha.toISOString().split('T')[0]:''}"></div>
      </div>
      <div style="display:flex;gap:10px;margin-top:0">
        <div style="flex:1"><label>FTE capturado real</label><input type="number" step="0.5" min="0" id="edit-fte" value="${rec.fteCapturado||0}"></div>
        <div style="flex:1"><label>COP capturado (Millones)</label><input type="number" min="0" id="edit-cop" value="${Math.round((rec.copCapturado||0)/1e6)}"></div>
      </div>
      <div id="modal-inline-msg" style="display:none;color:var(--red);font-size:12px;font-weight:600;padding:8px 10px;background:var(--redBg);border-radius:7px;margin-bottom:8px;border:1px solid var(--redLine)"></div>
      <div style="text-align:right;margin-top:4px;display:flex;gap:8px;justify-content:flex-end">
        <button class="btn ghost" onclick="closeModal()">Cancelar</button>
        <button class="btn primary" style="background:var(--amber)" onclick="saveEdits('${id}')">Guardar cambios</button>
      </div>
    </div>
    <div class="seg-section-h">Bitácora de seguimiento</div>
    <div class="seg-list">${segs}</div>`;
  }else{
    // FIX #6: mostrar estado con color
    body=`<div class="mrow" style="background:var(--paper);padding:12px;border-radius:8px;border:1px solid var(--line);margin-bottom:16px">
      <div class="mf"><div class="ml">Estado</div><div class="mv">${stBadge}</div></div>
      <div class="mf"><div class="ml">Impacto comprometido</div><div class="mv">${i.fte?i.fte+' FTE &nbsp;':''} ${fmtCOP(i.cop)}</div></div>
      <div class="mf"><div class="ml">Capturado real</div><div class="mv" style="color:var(--green)">${rec.fteCapturado||0} FTE · ${fmtCOP(rec.copCapturado)}</div></div>
    </div>
    <div class="add-box" id="add-box-${id}">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <label style="font-size:10.5px;font-weight:700;color:var(--sky);text-transform:uppercase;letter-spacing:.5px">Agregar seguimiento</label>
        <span style="font-size:11px;color:var(--muted);font-weight:600">Como: <b style="color:var(--navy)">${getAutor()}</b></span>
      </div>
      <textarea id="seg-txt" placeholder="Registra un avance, decisión, novedad o próximo paso…"></textarea>
      <div class="add-actions">
        <button class="btn ghost" onclick="closeModal()">Cerrar</button>
        <button class="btn primary" onclick="addSeg('${id}')">Guardar nota</button>
      </div>
    </div>
    <div class="seg-section-h">Historial</div>
    <div class="seg-list">${segs}</div>`;
  }

  document.getElementById('modal').innerHTML=`
    <div class="modal-top">
      <button class="modal-close" onclick="closeModal()">×</button>
      <div class="modal-tag">${VP_NAMES[i.vp]} · ${i.dept} · ${i.tipo==='Tecnologia'?'Tecnología':'Decisión/Proceso'}</div>
      <div class="modal-ttl">${esc(i.plan)}</div>
    </div>
    <div class="modal-body">${body}</div>`;
  document.getElementById('overlay').classList.add('show');
}

function closeModal(){document.getElementById('overlay').classList.remove('show');}

async function saveEdits(id){
  const txt=document.getElementById('edit-plan').value.trim();
  const st=document.getElementById('edit-st').value;
  const fte=parseFloat(document.getElementById('edit-fte').value)||0;
  const cop=(parseFloat(document.getElementById('edit-cop').value)||0)*1e6;
  const dateVal=document.getElementById('edit-fecha').value;
  if(!txt)return;
  const i=DATA_MAP.get(id)||DATA.find(x=>x.id===id); // BUG #9: O(1) lookup
  if(!i){console.warn('saveEdits: id not found',id);closeModal();return;} // F3: null guard

  // BUG #5: validación inline sin alert()
  if(st==='En curso'&&store[id].status!=='En curso'&&store[id].segs.length===0){
    const msgEl=document.getElementById('modal-inline-msg');
    if(msgEl){
      msgEl.textContent='⚠️ Para iniciar esta actividad primero agrega una nota en la bitácora (pestaña Seguimiento).';
      msgEl.style.display='block';
      // Scroll al mensaje
      msgEl.scrollIntoView({behavior:'smooth',block:'center'});
    }
    return;
  }

  i.plan=txt;
  store[id].planOverride=txt;
  store[id].status=st;
  store[id].fteCapturado=fte;
  store[id].copCapturado=cop;
  store[id].fechaOverride=dateVal||null;

  if(dateVal){const[y,m,d]=dateVal.split('-');i.fecha=new Date(y,m-1,d);i.fechaTxt=`${d}/${m}/${y}`;}
  else{i.fecha=null;i.fechaTxt='Sin fecha';}

  await saveRec(id);
  // BUG #4: Cerrar modal tras guardar y mostrar confirmación en tabla
  showToast('Cambios guardados correctamente ✓','success');
  closeModal();
  render();
}

// FIX #4: addSeg llama PRIMERO a apiCall('addSeg') y LUEGO saveRec (sin segs)
// FIX #2: addSeg NO cambia el estado automáticamente
async function addSeg(id){
  const txt=document.getElementById('seg-txt').value.trim();
  if(!txt){
    document.getElementById('seg-txt').style.border='2px solid var(--red)';
    document.getElementById('seg-txt').placeholder='⚠️ Escribe algo antes de guardar';
    return;
  }
  // BUG #8: autor automático según sesión, no select manual
  const autor=getAutor();
  const fecha=new Date().toLocaleDateString('es-CO',{year:'numeric',month:'short',day:'numeric'});
  const seg={autor,fecha,txt};
  store[id].segs.unshift(seg);

  // FIX #4: primero enviar el segmento al Sheet de Bitácora
  const segRes=await apiCall('addSeg',{id,seg});
  // T7: feedback si falla
  if(!segRes||segRes.error){
    showToast('⚠️ La nota se guardó localmente pero no en la nube. Verifica tu conexión.','warn',5000);
  } else {
    showToast('Nota guardada correctamente ✓','success');
  }
  // FIX #1: saveRec sin segs — solo guarda status/fte/cop/plan
  await saveRec(id);

  openModal(id,false);
  render();
}

// ─── TABS & CHIPS ─────────────────────────────────────────
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');view=t.dataset.view;render();
});
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
  const f=c.dataset.f;
  document.querySelectorAll(`.chip[data-f="${f}"]`).forEach(x=>x.classList.remove('on'));
  c.classList.add('on');
  filter[f]=c.dataset.v;
  render();
});
document.getElementById('overlay').onclick=e=>{if(e.target.id==='overlay')closeModal();};

// ─── AUTO-LOGIN SI HAY SESIÓN ─────────────────────────────
if(sessionRole&&sessionPass){initApp();}
else{document.getElementById('login-screen').style.display='flex';}
