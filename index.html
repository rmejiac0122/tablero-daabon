<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablero de Optimización — Grupo Daabon 2026</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap');
:root{
  --navy:#0E2340;--navy2:#172F52;--navy3:#1E3D6A;
  --sky:#3A82C4;--sky2:#5B9DD4;--skyBg:#EAF3FB;
  --ink:#1A2B3C;--mid:#4A6278;--muted:#8099B0;--line:#D8E6F0;--paper:#F4F8FC;--white:#fff;
  --green:#2D7D5E;--greenBg:#E6F4EE;--greenLine:#A8D5C1;
  --amber:#B87820;--amberBg:#FDF3E0;--amberLine:#F0CC84;
  --red:#C03830;--redBg:#FAEAE8;--redLine:#E8A8A4;
  --gray:#788FA0;--grayBg:#EEF3F7;
  --gold:#C8943A;
  --font:'DM Sans',system-ui,sans-serif;
  --display:'DM Serif Display',Georgia,serif;
  --mono:'DM Mono',monospace;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);color:var(--ink);background:var(--paper);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}

/* ── TOPBAR ── */
.topbar{background:var(--navy);color:#fff;padding:0 28px}
.topbar-inner{display:flex;align-items:flex-end;justify-content:space-between;padding:20px 0 0;flex-wrap:wrap;gap:10px}
.brand-lock{display:flex;flex-direction:column;gap:2px}
.brand-tag{font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:#6A94BE;margin-bottom:2px}
.brand-title{font-family:var(--display);font-size:26px;color:#fff;line-height:1.1}
.brand-sub{font-size:12px;color:#8CAEC8;margin-top:3px}
.topbar-meta{text-align:right;font-size:11.5px;color:#6A94BE;padding-bottom:4px}
.topbar-meta b{color:#A8C8E0}
.user-select { display:flex; align-items:center; gap:8px; margin-right:20px; }
.user-select select { background:var(--navy2); color:#fff; border:1px solid #6A94BE; padding:5px 10px; border-radius:6px; font-family:var(--font); font-size:12px; outline:none; cursor:pointer; }
.user-select label { font-size:11px; color:#8CAEC8; font-weight:600; text-transform:uppercase; letter-spacing:0.5px; }

.tabs{display:flex;gap:1px;margin-top:18px}
.tab{padding:11px 22px;font-size:12.5px;font-weight:600;color:#7AAABF;cursor:pointer;border-radius:8px 8px 0 0;background:transparent;border:none;font-family:var(--font);letter-spacing:.2px;transition:.15s}
.tab:hover{color:#fff;background:rgba(255,255,255,.07)}
.tab.active{background:var(--paper);color:var(--navy);font-weight:700}

/* ── TOOLBAR ── */
.toolbar{background:var(--white);border-bottom:1px solid var(--line);padding:14px 28px;display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.fgroup{display:flex;align-items:center;gap:8px}
.fgroup label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
.chip{padding:6px 14px;font-size:12px;border:1.5px solid var(--line);background:var(--white);border-radius:20px;cursor:pointer;color:var(--muted);font-weight:500;transition:.15s;font-family:var(--font)}
.chip:hover{border-color:var(--sky);color:var(--sky)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}

/* ── CONTENT ── */
.content{padding:24px 28px;max-width:1260px;margin:0 auto}

/* ── KPI STRIP ── */
.kpi-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:24px}
.kpi{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;position:relative;overflow:hidden;transition:.15s}
.kpi::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px}
.kpi.k0::after{background:linear-gradient(90deg,var(--sky),var(--navy))}
.kpi.k1::after{background:var(--green)}
.kpi.k2::after{background:var(--gold)}
.kpi.k3::after{background:var(--amber)}
.kpi.k4::after{background:var(--red)}
.kpi-num{font-family:var(--display);font-size:32px;color:var(--navy);line-height:1;margin-bottom:6px}
.kpi-num sup{font-size:14px;vertical-align:super}
.kpi-lbl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.kpi-det{font-size:11.5px;color:var(--mid);margin-top:5px}

/* ── VP CARDS GRID ── */
.vp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px}
.vp-card{background:var(--white);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:.15s}
.vp-card:hover{border-color:var(--sky2);box-shadow:0 4px 18px rgba(58,130,196,.12)}
.vp-card.selected{border-color:var(--sky);box-shadow:0 0 0 2px var(--sky)}
.vp-card-head{padding:14px 16px;display:flex;justify-content:space-between;align-items:flex-start}
.vp-name{font-family:var(--display);font-size:16px;color:var(--navy)}
.vp-badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:5px;background:var(--skyBg);color:var(--sky);text-transform:uppercase;letter-spacing:.4px}
.vp-valor{font-family:var(--mono);font-size:20px;font-weight:500;color:var(--navy);padding:0 16px 4px}
.vp-valor small{font-family:var(--font);font-size:10.5px;color:var(--muted);font-weight:400}
.vp-bar{height:6px;background:var(--grayBg);margin:10px 16px}
.vp-bar-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--green),var(--sky))}
.vp-footer{display:flex;justify-content:space-between;padding:10px 16px 14px;font-size:11.5px;color:var(--muted)}
.vp-footer b{color:var(--ink)}

/* ── SECTION HEADER ── */
.sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sec-title{font-family:var(--display);font-size:19px;color:var(--navy)}
.sec-sub{font-size:12px;color:var(--muted)}

/* ── TABLE ── */
.tbl-wrap{background:var(--white);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:20px}
table{width:100%;border-collapse:collapse}
thead tr{background:var(--navy)}
th{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#9BBBD0;padding:12px 14px;text-align:left}
td{padding:12px 14px;border-bottom:1px solid var(--line);font-size:12.5px;vertical-align:top}
tr.data-row:last-child td{border-bottom:none}
tr.data-row:hover td{background:var(--skyBg)}
tr.late-row td { background: #FFF4F4; }
.dept-sep td{background:var(--navy2);color:#fff;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;padding:8px 14px;border-bottom:none}
.plan-text{color:var(--ink);line-height:1.45;max-width:380px}
.plan-area{font-size:10.5px;color:var(--muted);margin-top:2px}
.tipo-tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:5px;white-space:nowrap}
.tipo-tag.tec{background:var(--skyBg);color:#2A6FA0}
.tipo-tag.pro{background:var(--greenBg);color:var(--green)}
.impact-val{font-family:var(--mono);font-size:12.5px;font-weight:500;color:var(--navy)}
.impact-sub{font-size:10.5px;color:var(--muted)}
.fecha-cell{font-size:12px;color:var(--mid);white-space:nowrap}
.fecha-cell.late{color:var(--red);font-weight:700}
.st-btn{display:inline-flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;cursor:pointer;border:1.5px solid var(--line);border-radius:7px;padding:5px 12px;background:var(--white);font-family:var(--font);transition:.15s;white-space:nowrap;min-width:90px}
.st-btn:hover{opacity:.85}
.st-btn.done{background:var(--green);border-color:var(--green);color:#fff}
.st-btn.prog{background:var(--amberBg);border-color:var(--amberLine);color:var(--amber)}
.st-btn.pend{background:var(--grayBg);border-color:var(--line);color:var(--gray)}
.st-btn.block{background:var(--redBg);border-color:var(--redLine);color:var(--red)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.done,.dot.ejecutado{background:var(--green)}.dot.prog{background:var(--amber)}.dot.pend{background:var(--gray)}.dot.block{background:var(--red)}
.seg-btn{font-size:11px;font-weight:600;color:var(--sky);background:var(--skyBg);border:none;padding:5px 10px;border-radius:6px;cursor:pointer;font-family:var(--font);white-space:nowrap;transition:.15s}
.seg-btn:hover{background:var(--sky);color:#fff}
.seg-count{display:inline-block;min-width:16px;text-align:center;background:var(--navy);color:#fff;border-radius:10px;font-size:10px;padding:1px 5px;margin-left:3px}

/* ── CRONOGRAMA ── */
.crono-switch{display:flex;gap:6px;margin-bottom:16px}
.c-btn{padding:7px 16px;font-size:12.5px;font-weight:600;border-radius:7px;border:1.5px solid var(--line);background:var(--white);color:var(--muted);cursor:pointer;font-family:var(--font);transition:.15s}
.c-btn.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.tl-wrap{background:var(--white);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px;overflow:hidden}
.tl-head{background:var(--navy2);padding:11px 18px;display:flex;justify-content:space-between;align-items:center}
.tl-vp{color:#fff;font-weight:700;font-size:12.5px;letter-spacing:.5px;text-transform:uppercase}
.tl-vp-val{font-family:var(--mono);font-size:11.5px;color:#8CAEC8}
.tl-scroll{overflow-x:auto;padding:12px 16px 16px}
.tl-track{position:relative;min-width:900px}
.tl-months{display:grid;grid-template-columns:repeat(12,1fr)}
.tl-m{text-align:center;font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;padding-bottom:8px}
.tl-line{height:2px;background:var(--line);border-radius:2px;margin-bottom:0;position:relative}
.tl-line-fill{position:absolute;top:0;left:0;height:100%;background:linear-gradient(90deg,var(--green),var(--sky));border-radius:2px;transition:.6s}
.tl-cols{display:grid;grid-template-columns:repeat(12,1fr);margin-top:0}
.tl-col{position:relative;border-right:1px dashed #E8EFF5;padding-top:10px;min-height:60px}
.tl-col:last-child{border-right:none}
.tl-item{cursor:pointer;text-align:center;margin:0 2px 8px;transition:.15s}
.tl-item:hover .tl-chip{background:var(--navy);color:#fff;border-color:var(--navy)}
.tl-chip{font-size:9.5px;font-weight:600;line-height:1.3;padding:4px 7px;border-radius:8px;background:var(--paper);border:1px solid var(--line);color:var(--ink);display:block;word-break:break-word;text-align:center;transition:.15s;min-width:72px}
.tl-chip.tl-done{border-color:var(--greenLine);background:var(--greenBg);color:var(--green)}
.tl-chip.tl-pend{border-color:var(--line);background:var(--grayBg);color:var(--gray)}
.tl-chip.tl-late{border-color:var(--redLine);background:var(--redBg);color:var(--red)}
.tl-chip .tl-dept{font-size:9.5px;font-weight:700;display:block;margin-bottom:2px}
.tl-chip .tl-imp{font-size:8.5px;font-weight:600;opacity:.85;display:block}
.tl-nodate{padding:8px 16px 12px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tl-nd-lbl{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.tl-nd-chip{font-size:11px;padding:3px 10px;border-radius:20px;cursor:pointer;font-weight:500;border:1px solid var(--line);background:var(--paper);color:var(--mid);transition:.15s}
.tl-nd-chip:hover{background:var(--navy);color:#fff;border-color:var(--navy)}
.tl-nd-chip.tl-done{border-color:var(--greenLine);background:var(--greenBg);color:var(--green)}
.tl-nd-chip.tl-late{border-color:var(--redLine);background:var(--redBg);color:var(--red)}
.tl-nd-chip.tl-pend{border-color:var(--line);background:var(--grayBg);color:var(--gray)}
/* lista crono */
.lista-wrap{background:var(--white);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px;overflow:hidden}
.lista-head{background:var(--navy2);padding:11px 18px;display:flex;justify-content:space-between;align-items:center}
.lista-vp{color:#fff;font-weight:700;font-size:12.5px;letter-spacing:.5px;text-transform:uppercase}
.lista-tbl{width:100%;border-collapse:collapse}
.lista-tbl th{background:var(--paper);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;color:var(--muted);padding:9px 14px;border-bottom:1px solid var(--line);text-align:left}
.lista-tbl td{padding:10px 14px;border-bottom:1px solid var(--line);font-size:12.5px;vertical-align:middle}
.lista-tbl tr:last-child td{border-bottom:none}
.lista-tbl tr:hover td{background:var(--skyBg);cursor:pointer}
.leg{display:flex;gap:14px;padding:13px 18px;background:var(--white);border:1px solid var(--line);border-radius:var(--r);flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:4px}
.leg span{display:inline-flex;align-items:center;gap:6px}

/* ── MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(10,25,50,.6);display:none;align-items:flex-start;justify-content:center;padding:36px 16px;z-index:100;overflow-y:auto;backdrop-filter:blur(3px)}
.overlay.show{display:flex}
.modal{background:var(--white);border-radius:14px;max-width:600px;width:100%;box-shadow:0 32px 80px rgba(0,0,0,.35)}
.modal-top{background:var(--navy);padding:20px 24px;border-radius:14px 14px 0 0}
.modal-tag{font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#6A94BE;margin-bottom:6px}
.modal-ttl{font-family:var(--display);font-size:17px;color:#fff;line-height:1.4}
.modal-body{padding:22px 24px}
.mrow{display:flex;gap:18px;margin-bottom:16px;flex-wrap:wrap}
.mf{flex:1;min-width:110px}
.mf .ml{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:4px}
.mf .mv{font-size:14px;font-weight:700;color:var(--navy)}
.mf select,.mf input[type=number]{width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:7px;font-family:var(--font);font-size:13px;color:var(--ink);background:var(--white)}
.mf select:focus,.mf input:focus{outline:none;border-color:var(--sky)}
.mf select:disabled,.mf input:disabled{background:var(--grayBg); cursor:not-allowed; opacity:0.8;}
.seg-section-h{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:18px 0 10px;padding-top:16px;border-top:1px solid var(--line)}
.seg-list{display:flex;flex-direction:column;gap:9px;max-height:220px;overflow-y:auto;margin-bottom:14px}
.seg-item{background:var(--paper);border-left:3px solid var(--sky);border-radius:0 8px 8px 0;padding:10px 14px}
.seg-item .si-meta{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-bottom:4px}
.seg-item .si-meta b{color:var(--navy)}
.seg-item .si-txt{font-size:12.5px;color:var(--ink);line-height:1.45}
.seg-empty{font-size:12.5px;color:var(--muted);font-style:italic;padding:6px 0}
.add-box{background:var(--skyBg);border-radius:10px;padding:14px}
.add-box select,.add-box textarea{width:100%;border:1.5px solid #C8DEF0;border-radius:7px;padding:8px 10px;font-family:var(--font);font-size:13px;margin-bottom:8px;resize:vertical;background:var(--white)}
.add-box textarea{min-height:56px}
.add-box select:focus,.add-box textarea:focus{outline:none;border-color:var(--sky)}
.add-actions{display:flex;justify-content:flex-end;gap:8px}
.btn{padding:8px 18px;border-radius:7px;font-weight:600;font-size:12.5px;cursor:pointer;border:none;font-family:var(--font);transition:.15s}
.btn.primary{background:var(--navy);color:#fff}.btn.primary:hover{background:var(--navy3)}
.btn.ghost{background:transparent;color:var(--muted);border:1.5px solid var(--line)}.btn.ghost:hover{border-color:var(--sky);color:var(--sky)}
.modal-close{float:right;cursor:pointer;color:#6A94BE;font-size:22px;line-height:1;border:none;background:none;padding:0}
.saved-note{font-size:11px;color:var(--green);font-weight:700;opacity:0;transition:.3s;margin-left:8px}
.saved-note.show{opacity:1}
@media(max-width:900px){.kpi-strip{grid-template-columns:repeat(3,1fr)}.vp-grid{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.kpi-strip{grid-template-columns:1fr 1fr}.vp-grid{grid-template-columns:1fr}}

.edit-box{background:#FFF8EE;border:1.5px solid var(--amberLine);border-radius:10px;padding:13px;margin-bottom:12px}
.edit-box .edit-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--amber);margin-bottom:6px}
.edit-box textarea{width:100%;border:1.5px solid var(--amberLine);border-radius:7px;padding:8px 10px;font-family:var(--font);font-size:13px;resize:vertical;min-height:56px;background:var(--white)}
.edit-box textarea:focus{outline:none;border-color:var(--amber)}
.edit-toggle{font-size:11px;font-weight:600;color:var(--amber);background:var(--amberBg);border:1px solid var(--amberLine);padding:4px 10px;border-radius:6px;cursor:pointer;font-family:var(--font);margin-left:8px}
.edit-toggle:hover{background:var(--amber);color:#fff}
.btn-nueva{font-size:12px;font-weight:700;color:#fff;background:var(--green);border:none;padding:8px 16px;border-radius:8px;cursor:pointer;font-family:var(--font);display:inline-flex;align-items:center;gap:6px;transition:.15s}
.btn-nueva:hover{background:var(--navy)}
.nueva-form{background:var(--white);border:1.5px solid var(--greenLine);border-radius:12px;padding:18px 20px;margin-bottom:20px}
.nueva-form .nf-title{font-family:var(--display);font-size:15px;color:var(--navy);margin-bottom:14px}
.nueva-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.nf-field label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);display:block;margin-bottom:4px}
.nf-field input,.nf-field select,.nf-field textarea{width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:7px;font-family:var(--font);font-size:13px;color:var(--ink)}
.nf-field input:focus,.nf-field select:focus,.nf-field textarea:focus{outline:none;border-color:var(--sky)}
.nf-field textarea{min-height:56px;resize:vertical}
.nf-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand-lock">
      <div class="brand-tag">Grupo Daabon · Comité de Negocios</div>
      <div class="brand-title">Tablero de Optimización 2026</div>
      <div class="brand-sub">Seguimiento a ejecución e impacto por vicepresidencia</div>
    </div>
    <div style="display:flex; align-items:flex-end; gap:20px; text-align:right;">
      <div class="user-select">
        <label>Usuario:</label>
        <select id="user-role" onchange="changeRole()">
          <option value="admin">Administrador (Ver/Editar Todo)</option>
          <option value="VPDH">VP Desarrollo Humano</option>
          <option value="VPE">VP Ejecutiva</option>
          <option value="VPF">VP Financiera</option>
          <option value="VLOP">VP Log. & Operaciones</option>
          <option value="AUD">Auditoría</option>
        </select>
      </div>
      <div class="topbar-meta">Valor total comprometido<br><b id="topbar-total">$6.334 M COP</b></div>
    </div>
  </div>
  <div class="tabs">
    <button class="tab active" data-view="panel">Panel Ejecutivo</button>
    <button class="tab" data-view="seguimiento">Seguimiento por VP</button>
    <button class="tab" data-view="cronograma">Cronograma</button>
  </div>
</div>

<div class="toolbar">
  <div class="fgroup">
    <label>VP</label>
    <button class="chip on" data-f="vp" data-v="all">Todas</button>
    <button class="chip" data-f="vp" data-v="VPDH">DH</button>
    <button class="chip" data-f="vp" data-v="VPE">Ejecutiva</button>
    <button class="chip" data-f="vp" data-v="VPF">Financiera</button>
    <button class="chip" data-f="vp" data-v="VLOP">Log. Operaciones</button>
    <button class="chip" data-f="vp" data-v="AUD">Auditoría</button>
  </div>
  <div class="fgroup">
    <label>Tipo</label>
    <button class="chip on" data-f="tipo" data-v="all">Todas</button>
    <button class="chip" data-f="tipo" data-v="Proceso">Decisión/Proceso</button>
    <button class="chip" data-f="tipo" data-v="Tecnologia">Tecnología</button>
  </div>
</div>

<div class="content" id="content"></div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<script>
// ── HELPERS ──

async function apiGet(params){
  if(!API_URL) return null;
  try{
    const url = API_URL + '?' + new URLSearchParams(params);
    const r = await fetch(url);
    const json = await r.json();
    return json;
  }catch(e){ console.warn('apiGet error',e); return null; }
}

async function apiPost(body){
  if(!API_URL) return null;
  try{
    const params = new URLSearchParams({
      action: body.action,
      data: JSON.stringify(body)
    });
    const r = await fetch(API_URL + '?' + params.toString());
    return await r.json();
  }catch(e){ console.warn('apiPost error',e); return null; }
}

async function loadStore(){
  for(const it of DATA){
    const isEjec = it.status==='Ejecutado';
    store[it.id] = {
      status: it.status,
      fteCapturado: isEjec&&it.fte ? it.fte : 0,
      copCapturado: isEjec&&it.cop ? it.cop : 0,
      segs: [],
      planOverride: null,
      fechaOverride: null
    };
  }

  if(API_URL && API_URL.includes('macros/s/')){
    const data = await apiGet({action:'getAll'});
    if(data && !data.error){
      API_OK = true;
      Object.keys(data.records).forEach(id => {
        const rec = data.records[id];
        if(!store[id]) store[id] = {status:'Pendiente',fteCapturado:0,copCapturado:0,segs:[],planOverride:null, fechaOverride:null};
        if(rec.status) store[id].status = rec.status;
        if(rec.fteCapturado != null) store[id].fteCapturado = Number(rec.fteCapturado)||0;
        if(rec.copCapturado != null) store[id].copCapturado = Number(rec.copCapturado)||0;
        
        // Inyectar datos guardados
        if(rec.planOverride){ 
          store[id].planOverride = rec.planOverride; 
          const it=DATA.find(x=>x.id===id); 
          if(it) it.plan=rec.planOverride; 
        }
        if(rec.fechaOverride){ 
          store[id].fechaOverride = rec.fechaOverride;
          const it=DATA.find(x=>x.id===id);
          if(it){
            const [y, m, d] = rec.fechaOverride.split('-');
            it.fecha = new Date(y, m-1, d);
            it.fechaTxt = `${d}/${m}/${y}`;
          }
        }
        if(rec.segs && rec.segs.length) store[id].segs = rec.segs;
      });
      if(data.customs && data.customs.length){
        data.customs.forEach(init=>{
          if(!DATA.find(x=>x.id===init.id)){
            DATA.push({...init, fecha:null});
            if(!store[init.id]) store[init.id]={status:init.status,fteCapturado:0,copCapturado:0,segs:[],planOverride:null, fechaOverride:null};
          }
        });
      }
    } else {
      console.warn('Sheets error:', data);
    }
  }
}

  const dept=document.getElementById('nf-dept').value.trim()||'Sin departamento';

  const fte=parseFloat(document.getElementById('nf-fte').value)||null;
  const cop=(parseFloat(document.getElementById('nf-cop').value)||0)*1e6;
  const fechaVal=document.getElementById('nf-fecha').value;
  const fecha=fechaVal?new Date(fechaVal):null;
  const fechaTxt=document.getElementById('nf-fechatxt').value.trim()||(fechaVal?fechaVal:'Por definir');

  render();

  });

  const leg=`<div class="leg">
    <span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--greenBg);border:1.5px solid var(--greenLine);margin-right:4px"></span>Completado</span>
    <span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--grayBg);border:1.5px solid var(--line);margin-right:4px"></span>Pendiente / En curso</span>
    <span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--redBg);border:1.5px solid var(--redLine);margin-right:4px"></span>Atrasado / Sin Fecha</span>
    <span style="margin-left:auto;font-size:11px">Clic para abrir bitácora</span>
  </div>`;
  document.getElementById('content').innerHTML=switcher+body+leg;
}

function tlColor(i){
  const st = store[i.id].status;
  if(['Ejecutado','Ejecutado'].includes(st)) return 'tl-done';
  if(!i.fecha || i.fecha < TODAY) return 'tl-late';
  return 'tl-pend';
}
function tlImpact(i){
  const parts=[];
  if(i.fte) parts.push('-'+fmtN(i.fte)+' FTE');
  if(i.cop) parts.push(fmtCOP(i.cop));
  return parts.join(' · ')||'';
}
function buildTL(arr,label,val){
  const buckets=Array.from({length:12},()=>[]);
  const nodate=[];
  arr.forEach(i=>{ if(i.fecha&&i.fecha.getFullYear()===2026) buckets[i.fecha.getMonth()].push(i); else nodate.push(i); });
  const maxStack=Math.max(...buckets.map(b=>b.length),1);
  const tlH=Math.max(90,16+maxStack*68+12);
  const progPct=Math.round(arr.filter(i=>['Ejecutado','Ejecutado'].includes(store[i.id].status)).length/arr.length*100);
  let cols='';
  for(let m=0;m<12;m++){
    let items2='';
    buckets[m].forEach((i)=>{
      const cls=tlColor(i);
      const imp=tlImpact(i);
      items2+=`<div class="tl-item" onclick="openModal('${i.id}')" title="${i.plan}">
        <span class="tl-chip ${cls}">
          <span class="tl-dept">${i.dept}</span>
          ${imp?`<span class="tl-imp">${imp}</span>`:''}
        </span>
      </div>`;
    });
    cols+=`<div class="tl-col">${items2}</div>`;
  }
  const nd=nodate.length?`<div class="tl-nodate"><span class="tl-nd-lbl">Sin fecha:</span>${nodate.map(i=>{
    const cls=tlColor(i); const imp=tlImpact(i);
    return `<span class="tl-nd-chip ${cls}" onclick="openModal('${i.id}')" title="${i.plan}">${i.dept}${imp?' · '+imp:''}</span>`;
  }).join('')}</div>`:'';
  return `<div class="tl-wrap">
    <div class="tl-head"><span class="tl-vp">${label}</span><span class="tl-vp-val">${val}</span></div>
    <div class="tl-scroll"><div class="tl-track" style="height:${tlH+30}px">
      <div class="tl-months">${MONTHS.map(m=>`<div class="tl-m">${m}</div>`).join('')}</div>
      <div class="tl-line"><div class="tl-line-fill" style="width:${progPct}%"></div></div>
      <div class="tl-cols" style="height:${tlH}px">${cols}</div>
    </div></div>${nd}
  </div>`;
}

function buildLista(arr,label){
  const sorted=[...arr].sort((a,b)=>{ if(!a.fecha&&!b.fecha) return 0; if(!a.fecha) return -1; if(!b.fecha) return 1; return a.fecha-b.fecha; });
  const rows=sorted.map(i=>{
    const sc=SC[store[i.id].status]||'pend';
    const late=(!i.fecha || i.fecha < TODAY) && !['Ejecutado','Ejecutado'].includes(store[i.id].status);
    return `<tr onclick="openModal('${i.id}')">
      <td><b>${i.dept}</b></td>
      <td style="max-width:340px">${i.plan.length>70?i.plan.slice(0,68)+'…':i.plan}</td>
      <td><span class="tipo-tag ${i.tipo==='Tecnologia'?'tec':'pro'}">${i.tipo==='Tecnologia'?'Tec':'Proceso'}</span></td>
      <td class="fecha-cell ${late?'late':''}">${i.fechaTxt}</td>
      <td><span class="st-btn ${sc}" style="cursor:default">${store[i.id].status}</span></td>
    </tr>`;
  }).join('');
  return `<div class="lista-wrap">
    <div class="lista-head"><span class="lista-vp">${label}</span></div>
    <table class="lista-tbl"><thead><tr><th>Departamento</th><th>Iniciativa</th><th>Tipo</th><th>Fecha</th><th>Estado</th></tr></thead><tbody>${rows}</tbody></table>
  </div>`;
}

function setCronoSub(v){ cronoSub=v; renderCronograma(); }

// ── MODAL ──
let editingPlan = false;
function openModal(id, showEdit=false, requireNote=false){
  const i=DATA.find(x=>x.id===id);
  const rec=store[id];
  const editable = canEdit(i.vp); // Permisos

  const opts=['Pendiente','En curso','Ejecutado'].map(s=>`<option value="${s}" ${s===rec.status?'selected':''} ${!editable?'disabled':''}>${s}</option>`).join('');
  const aopts=AUTHORS.map(a=>`<option>${a}</option>`).join('');
  const segs=rec.segs.length
    ? rec.segs.map(s=>`<div class="seg-item"><div class="si-meta"><b>${s.autor}</b><span>${s.fecha}</span></div><div class="si-txt">${esc(s.txt)}</div></div>`).join('')
    : '<div class="seg-empty">Sin seguimientos registrados aún.</div>';
    
  const editPanel = showEdit && editable ? `
    <div class="edit-box">
      <div class="edit-lbl">✏️ Editar iniciativa</div>
      <textarea id="edit-plan">${esc(i.plan)}</textarea>
      
      <div class="edit-lbl" style="margin-top:10px">Fecha compromiso</div>
      <input type="date" id="edit-fecha" value="${i.fecha ? i.fecha.toISOString().split('T')[0] : ''}" style="width:100%; border:1.5px solid var(--amberLine); border-radius:7px; padding:6px 10px; font-family:var(--font); font-size:13px; background:var(--white);">
      
      <div style="display:flex;gap:8px;margin-top:12px;justify-content:flex-end">
        <button class="btn ghost" onclick="openModal('${id}',false)" style="font-size:12px;padding:6px 12px">Cancelar</button>
        <button class="btn primary" onclick="savePlan('${id}')" style="font-size:12px;padding:6px 12px;background:var(--amber)">Guardar cambio</button>
      </div>
    </div>` : '';

  document.getElementById('modal').innerHTML=`
    <div class="modal-top">
      <button class="modal-close" onclick="closeModal()">×</button>
      <div class="modal-tag">${VP_NAMES[i.vp]} · ${i.dept} · ${i.tipo==='Tecnologia'?'Tecnología':'Decisión/Proceso'}</div>
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-top:4px">
        <div class="modal-ttl" style="flex:1">${esc(i.plan)}</div>
        ${editable ? `<button class="edit-toggle" onclick="openModal('${id}',${!showEdit})">${showEdit?'✕ Cancelar':'✏️ Editar'}</button>` : ''}
      </div>
    </div>
    <div class="modal-body">
      ${editPanel}
      <div class="mrow">
        <div class="mf"><div class="ml">FTE comprometido</div><div class="mv">${i.fte?'-'+fmtN(i.fte)+' personas':'—'}</div></div>
        <div class="mf"><div class="ml">Valor comprometido</div><div class="mv">${fmtCOP(i.cop)}</div></div>
        <div class="mf"><div class="ml">Fecha</div><div class="mv">${i.fechaTxt}</div></div>
      </div>
      <div class="mrow">
        <div class="mf"><div class="ml">Estado actual</div><select id="m-st" onchange="updRec('${id}')">${opts}</select></div>
        <div class="mf"><div class="ml">FTE capturado real</div><input id="m-fte" type="number" step="0.5" min="0" value="${rec.fteCapturado||0}" onchange="updRec('${id}')" ${!editable?'disabled':''}></div>
        <div class="mf"><div class="ml">COP capturado (M)</div><input id="m-cop" type="number" step="1" min="0" value="${Math.round((rec.copCapturado||0)/1e6)}" onchange="updRec('${id}')" ${!editable?'disabled':''}></div>
      </div>
      <span class="saved-note" id="saved-note">Guardado ✓</span>
      <div class="seg-section-h">Bitácora de seguimiento</div>
      <div class="seg-list">${segs}</div>
      ${editable ? `
      <div class="add-box" id="add-box-${id}" style="${requireNote?'border:2px solid var(--amber);':''}">
        ${requireNote?'<div style="font-size:11px;font-weight:700;color:var(--amber);margin-bottom:8px">⚠️ Para pasar a "En curso" debes registrar la bitácora inicial.</div>':''}
        <select id="seg-autor">${aopts}</select>
        <textarea id="seg-txt" placeholder="${requireNote?'Describe con qué acción inicia esta iniciativa…':'Avance, decisión, bloqueo o próximo paso…'}"></textarea>
        <div class="add-actions">
          <button class="btn ghost" onclick="${requireNote ? `revertStatus('${id}')` : `closeModal()`}">${requireNote ? 'Cancelar' : 'Cerrar'}</button>
          <button class="btn primary" onclick="${requireNote?`confirmEnCurso('${id}')`:`addSeg('${id}')`}">${requireNote?'Confirmar inicio':'Agregar nota'}</button>
        </div>
      </div>` : '<div style="font-size:11px; color:var(--muted); font-style:italic;">No tienes permisos para agregar notas en esta VP.</div>'}
    </div>`;
  document.getElementById('overlay').classList.add('show');
}

function closeModal(){ document.getElementById('overlay').classList.remove('show'); }

window.revertStatus = function(id) {
  closeModal();
  openModal(id, false, false);
};

async function confirmEnCurso(id){
  const txt=document.getElementById('seg-txt').value.trim();
  if(!txt){ 
    document.getElementById('seg-txt').style.border='2px solid var(--red)';
    document.getElementById('seg-txt').placeholder='⚠️ Este campo es obligatorio para iniciar la actividad';
    return; 
  }
  const autor=document.getElementById('seg-autor').value;
  const fecha=new Date().toLocaleDateString('es-CO',{year:'numeric',month:'short',day:'numeric'});
  const seg={autor,fecha,txt};
  store[id].segs.unshift(seg);
  store[id].status='En curso';
  if(API_URL&&API_OK){ await apiPost({action:'addSeg',id,seg}); }
  await saveRec(id,autor);
  closeModal();
  render();
}

async function savePlan(id){
  const txt=document.getElementById('edit-plan').value.trim();
  const dateVal=document.getElementById('edit-fecha').value;
  if(!txt) return;
  const i=DATA.find(x=>x.id===id);
  
  i.plan=txt;
  store[id].planOverride=txt;
  store[id].fechaOverride=dateVal;
  
  if (dateVal) {
    const [y, m, d] = dateVal.split('-');
    i.fecha = new Date(y, m-1, d);
    i.fechaTxt = `${d}/${m}/${y}`;
  } else {
    i.fecha = null;
    i.fechaTxt = 'Sin fecha';
  }

  if(API_URL&&API_OK){ await apiPost({action:'updatePlan',id,plan:txt, fecha:dateVal}); }
  await saveRec(id);
  openModal(id,false);
  render();
}

async function updRec(id){
  const newSt = document.getElementById('m-st').value;
  
  // Forzar bitácora cuando pase a 'En curso'
  if (newSt === 'En curso' && store[id].status !== 'En curso') {
    document.getElementById('m-st').value = store[id].status;
    closeModal();
    openModal(id, false, true); 
    return;
  }

  store[id].status=newSt;
  store[id].fteCapturado=parseFloat(document.getElementById('m-fte').value)||0;
  store[id].copCapturado=(parseFloat(document.getElementById('m-cop').value)||0)*1e6;
  await saveRec(id);
  const n=document.getElementById('saved-note'); if(n){n.classList.add('show');setTimeout(()=>n.classList.remove('show'),1400);}
  render();
}

async function addSeg(id){
  const txt=document.getElementById('seg-txt').value.trim(); if(!txt) return;
  const autor=document.getElementById('seg-autor').value;
  const fecha=new Date().toLocaleDateString('es-CO',{year:'numeric',month:'short',day:'numeric'});
  const seg={autor,fecha,txt};
  store[id].segs.unshift(seg);
  if(API_URL&&API_OK){ await apiPost({action:'addSeg',id,seg}); }
  await saveRec(id,autor); openModal(id); render();
}

async function cycleStatus(id){
  const cur=store[id].status;
  const cycleStates=['Pendiente','En curso','Ejecutado'];
  const idx=cycleStates.indexOf(cur==='Atrasado'?'Pendiente':cur);
  const next=cycleStates[(idx+1)%cycleStates.length];
  if(next==='En curso'){
    openModal(id, false, true);
    return;
  }
  store[id].status=next; await saveRec(id); render();
}

function esc(s){ return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ── TABS & CHIPS ──
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{ document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active')); t.classList.add('active'); view=t.dataset.view; render(); });
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ const f=c.dataset.f; document.querySelectorAll(`.chip[data-f="${f}"]`).forEach(x=>x.classList.remove('on')); c.classList.add('on'); filter[f]=c.dataset.v; render(); });
document.getElementById('overlay').onclick=e=>{ if(e.target.id==='overlay') closeModal(); };

// ── INIT ──
(async()=>{ await loadStore(); render(); })();
</script>
